<!DOCTYPE html>
<html lang="es">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Torneo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-grid { display: grid; grid-template-columns: 350px 420px 1fr; gap: 20px; flex: 1; }
        input, select { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 10px; color: white; font-size: 15px; outline: none; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 13px; color: #bbbbbb; }
        .team-card { background: rgba(122, 60, 255, 0.1); border: 1px solid rgba(166, 92, 255, 0.3); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
        .team-title { font-size: 16px; font-weight: bold; color: #c38cff; margin-bottom: 6px; cursor: pointer; }
        .team-player { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.04); padding: 5px 8px; border-radius: 6px; margin-top: 4px; font-size: 13px; }
        .match-team { cursor: pointer; position: relative; }
        .match-team:hover { background: rgba(122, 60, 255, 0.4); }
        .winner-score { color: #2ecc71 !important; font-weight: bold; }

        .match-team .tooltip-name {
            visibility: hidden;
            background-color: #181824;
            color: #c38cff;
            text-align: center;
            border-radius: 6px;
            padding: 4px 8px;
            position: absolute;
            z-index: 10;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            border: 1px solid rgba(166, 92, 255, 0.4);
            font-size: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .match-team:hover .tooltip-name {
            visibility: visible;
        }

        #victoryModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 20, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
            backdrop-filter: blur(5px);
        }
        #victoryModal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .victory-content {
            background: linear-gradient(135deg, #1e1e2f, #2d1b4e);
            border: 2px solid #a65cff;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 50px rgba(166, 92, 255, 0.6);
            transform: scale(0.7);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 500px;
        }
        #victoryModal.active .victory-content {
            transform: scale(1);
        }
        .victory-title {
            font-size: 24px;
            color: #c38cff;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .victory-team-name {
            font-size: 32px;
            color: #ffffff;
            font-weight: bold;
            margin: 15px 0;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        .victory-tournament {
            border-color: gold !important;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.7) !important;
            background: linear-gradient(135deg, #2a2200, #4d3b00) !important;
        }
        .victory-tournament .victory-title {
            color: gold;
        }
    </style>
</head>
<body>

<div id="victoryModal">
    <div class="victory-content" id="victoryBoxContent">
        <div class="victory-title" id="victoryHeaderTitle">¡Ganador del Combate!</div>
        <div style="font-size: 14px; color: #aaa;">El equipo avanza de fase</div>
        <div class="victory-team-name" id="victoryTeamNameDisplay">NOMBRE DEL EQUIPO</div>
        <button class="btn-primary" onclick="closeVictoryModal()" style="margin-top: 15px; background: #6c5ce7;">¡Continuar!</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <h1>🛡 Panel de Administración</h1>
        <div class="nav-links">
            <a href="index.html" class="btn btn-secondary">Ver Espectador</a>
            <button class="btn-primary" onclick="logout()">Cerrar Sesión</button>
        </div>
    </div>

    <div class="admin-grid">
        <div class="panel">
            <h2>📝 Inscripciones</h2>
            <div style="font-size:14px; color:#b8ffb8;">Total inscritos: <span id="playerCounter">0</span></div>
            <div class="form-group"><label>Nombre:</label><input type="text" id="inputName" placeholder="Ej. Juan"></div>
            <div class="form-group"><label>ID (Battle.net / Discord):</label><input type="text" id="inputDiscordId" placeholder="Ej. Juan#1234"></div>
            <div class="form-group">
                <label>Rango:</label>
                <select id="inputRank">
                    <option value="bronze">Bronze</option><option value="silver">Silver</option><option value="gold" selected>Gold</option>
                    <option value="platinum">Platinum</option><option value="diamond">Diamond</option><option value="master">Master</option>
                    <option value="grandmaster">Grandmaster</option><option value="champion">Champion</option><option value="top 500">Top 500</option>
                </select>
            </div>
            <button class="btn-primary" onclick="addPlayer()">➕ Añadir al Roster</button>
            <button class="btn-secondary" onclick="clearRoster()">🗑 Limpiar Todo</button>
            <div id="rosterList" style="overflow-y:auto; max-height:200px; display:flex; flex-direction:column; gap:5px;"></div>
        </div>

        <div class="panel">
            <h2>🛡 Equipos (5v5)</h2>
            <button class="btn-primary" onclick="generateTeams()">🎲 Sortear y Balancear Equipos</button>
            <div id="teamsContainer" style="overflow-y:auto; flex:1;">
                <div style="color: #666; text-align:center; padding: 20px;">Sin equipos generados</div>
            </div>
        </div>

        <div class="panel">
            <h2>🏆 Control de Trayectoria</h2>
            <button class="btn-primary" onclick="startTournament()">▶ Generar / Reiniciar Bracket</button>
            <div class="bracket-wrapper" id="bracketContainer" style="overflow-y:auto; flex:1; display: flex; gap: 20px; align-items: center; justify-content: center;">
                <div style="color: #666; text-align:center;">Inicia el torneo para ver el bracket</div>
            </div>
        </div>
    </div>
</div>

<script>
    if(localStorage.getItem("isAdmin") !== "true") {
        window.location.href = "login.html";
    }

    const SUPABASE_URL = 'https://twxnbbgusthujzdikjeo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_czF-mMgKB69Ox0JtMb24KA_VSw-LGKm';
    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const rankValues = { "bronze": 1, "silver": 2, "gold": 3, "platinum": 4, "diamond": 5, "master": 6, "grandmaster": 7, "champion": 8, "top 500": 9 };

    let players = [];
    let teams = [];
    let rounds = [];
    let matchScores = {};
    let activeMatchData = null;
    let lastVictoryData = null;

    async function loadDataFromDB() {
        let { data: playerData } = await _supabase.from('players').select('*');
        if (playerData) players = playerData;

        let { data: stateData } = await _supabase.from('tournament_state').select('teams, rounds, match_scores, active_match, last_victory').eq('id', 1).single();
        if (stateData) {
            teams = stateData.teams || [];
            rounds = stateData.rounds || [];
            matchScores = stateData.match_scores || {};
            activeMatchData = stateData.active_match || null;
            lastVictoryData = stateData.last_victory || null;
        }
        renderAll();
    }

    async function saveTournamentStateDB() {
        let payload = {
            teams: teams,
            rounds: rounds,
            match_scores: matchScores,
            active_match: activeMatchData,
            last_victory: lastVictoryData
        };
        let { error } = await _supabase.from('tournament_state').update(payload).eq('id', 1);
        if(error) console.error("Error al guardar en Supabase:", error);
    }

    function logout() {
        localStorage.removeItem("isAdmin");
        window.location.href = "index.html";
    }

    async function addPlayer() {
        let name = document.getElementById("inputName").value.trim();
        let discordId = document.getElementById("inputDiscordId").value.trim();
        let rank = document.getElementById("inputRank").value;
        if(!name) return alert("Escribe un nombre.");

        let newPlayer = { name, discord_id: discordId || "N/A", rank, value: rankValues[rank] };
        let { data, error } = await _supabase.from('players').insert([newPlayer]).select();
        if(error) { alert("Error al guardar en Supabase"); return; }

        if(data) players.push(data[0]);
        document.getElementById("inputName").value = "";
        document.getElementById("inputDiscordId").value = "";
        renderAll();
    }

    async function removePlayerFromRoster(index) {
        let player = players[index];
        if(player.id) { await _supabase.from('players').delete().eq('id', player.id); }
        players.splice(index, 1);
        renderAll();
    }

    async function clearRoster() {
        if(confirm("¿Vaciar todo?")) {
            players = []; teams = []; rounds = []; matchScores = {}; activeMatchData = null; lastVictoryData = null;
            await _supabase.from('players').delete().neq('id', 0);
            await saveTournamentStateDB();
            renderAll();
        }
    }

    async function generateTeams() {
        if(players.length < 5) return alert("Se necesitan al menos 5 jugadores.");
        let sorted = [...players].sort((a,b) => b.value - a.value);
        let numTeams = Math.ceil(sorted.length / 5);
        teams = [];
        for(let i=0; i<numTeams; i++) {
            let defaultName = `Equipo ${i+1}`;
            let defaultAbbr = `EQ${i+1}`;
            teams.push({ id: i+1, name: defaultName, abbr: defaultAbbr, players: [] });
        }

        let cur = 0, dir = 1;
        sorted.forEach(p => {
            teams[cur].players.push(p);
            cur += dir;
            if(cur >= numTeams || cur < 0) { dir *= -1; cur += dir; }
        });
        await saveTournamentStateDB();
        renderAll();
    }

    async function editTeamInfo(ti) {
        let currentTeam = teams[ti];
        let newName = prompt("Nuevo nombre del equipo:", currentTeam.name);
        if(!newName) return;

        let newAbbr = prompt("Nueva abreviatura (ej: T1, KINGS):", currentTeam.abbr || newName.substring(0,3).toUpperCase());
        if(!newAbbr) newAbbr = newName.substring(0,3).toUpperCase();
        newAbbr = newAbbr.trim().toUpperCase();

        let oldName = currentTeam.name;
        currentTeam.name = newName;
        currentTeam.abbr = newAbbr;

        rounds = rounds.map((side, sIdx) => {
            if (sIdx === 2) {
                return side.map(roundArr => roundArr.map(teamName => {
                    if (!teamName) return teamName;
                    if (teamName.includes("👑 CAMPEÓN")) {
                        return teamName.includes(oldName) ? `👑 CAMPEÓN: ${newName}` : teamName;
                    }
                    return teamName === oldName ? newName : teamName;
                }));
            }
            return side.map(roundArr => roundArr.map(teamName => teamName === oldName ? newName : teamName));
        });

        await saveTournamentStateDB();
        renderAll();
    }

    async function removePlayerFromTeam(teamIndex, playerIndex) {
        let player = teams[teamIndex].players[playerIndex];
        if(confirm(`¿Deseas eliminar a ${player.name} y dejar el espacio libre?`)) {
            if(player.id) {
                await _supabase.from('players').delete().eq('id', player.id);
                players = players.filter(p => p.id !== player.id);
            } else {
                players = players.filter(p => p.name !== player.name);
            }
            teams[teamIndex].players[playerIndex] = { name: "⚠️ [Espacio Libre]", discord_id: "N/A", rank: "N/A", isPlaceholder: true };
            await saveTournamentStateDB();
            renderAll();
        }
    }

    async function replacePlaceholderPlayer(teamIndex, playerIndex) {
        let newName = prompt("Nombre del jugador sustituto:");
        if(!newName) return;
        let newDiscordId = prompt("ID de Battle.net o Discord:", "Ej: User#1234");
        let newRank = prompt("Rango (bronze, silver, gold, platinum, diamond, master, grandmaster, champion, top 500):", "gold");

        let validRank = rankValues[newRank] ? newRank : "gold";
        let newPlayerObj = { name: newName, discord_id: newDiscordId || "N/A", rank: validRank, value: rankValues[validRank] };

        let { data, error } = await _supabase.from('players').insert([newPlayerObj]).select();
        if(error) { alert("Error al guardar en Supabase"); return; }

        if(data && data[0]) {
            players.push(data[0]);
            teams[teamIndex].players[playerIndex] = data[0];
        } else {
            teams[teamIndex].players[playerIndex] = newPlayerObj;
        }
        await saveTournamentStateDB();
        renderAll();
    }

    async function startTournament() {
        if(teams.length < 2) return alert("Genera equipos primero.");

        let teamNames = teams.map(t => t.name);
        let totalTeams = teamNames.length;

        let mid = Math.ceil(totalTeams / 2);
        let leftTeams = teamNames.slice(0, mid);
        let rightTeams = teamNames.slice(mid);

        let targetLeftSize = 1;
        while(targetLeftSize < leftTeams.length) targetLeftSize *= 2;
        while(leftTeams.length < targetLeftSize) leftTeams.push(null);

        let targetRightSize = 1;
        while(targetRightSize < rightTeams.length) targetRightSize *= 2;
        while(rightTeams.length < targetRightSize) rightTeams.push(null);

        let leftRounds = [leftTeams];
        while(leftRounds[leftRounds.length - 1].length > 2) {
            let prev = leftRounds[leftRounds.length - 1];
            let next = new Array(prev.length / 2).fill(null);
            leftRounds.push(next);
        }

        let rightRounds = [rightTeams];
        while(rightRounds[rightRounds.length - 1].length > 2) {
            let prev = rightRounds[rightRounds.length - 1];
            let next = new Array(prev.length / 2).fill(null);
            rightRounds.push(next);
        }

        rounds = [
            leftRounds,
            rightRounds,
            [[null, null]]
        ];

        matchScores = {};
        activeMatchData = null;
        lastVictoryData = null;
        await saveTournamentStateDB();
        renderAll();
    }

    function triggerVictoryModal(teamName, isTournamentWinner = false) {
        let modal = document.getElementById("victoryModal");
        let contentBox = document.getElementById("victoryBoxContent");
        let titleEl = document.getElementById("victoryHeaderTitle");
        let nameEl = document.getElementById("victoryTeamNameDisplay");

        nameEl.innerText = teamName;

        if (isTournamentWinner) {
            contentBox.classList.add("victory-tournament");
            titleEl.innerHTML = "👑 ¡CAMPEÓN DEL TORNEO! 👑";
        } else {
            contentBox.classList.remove("victory-tournament");
            titleEl.innerHTML = "🔥 ¡Ganador del Combate! 🔥";
        }

        modal.classList.add("active");
    }

    function closeVictoryModal() {
        document.getElementById("victoryModal").classList.remove("active");
    }

    async function advanceMatch(sideIndex, rIndex, teamIndex, teamName) {
        if(!teamName || teamName === "NULL" || teamName.includes("👑")) return;

        let sideRounds = rounds[sideIndex];
        let currentRoundList = sideRounds[rIndex];
        let nextR = rIndex + 1;

        if (nextR < sideRounds.length) {
            let slot = Math.floor(teamIndex / 2);
            sideRounds[nextR][slot] = teamName;
        } else {
            let finalSlot = sideIndex === 0 ? 0 : 1;
            if(!rounds[2]) rounds[2] = [[null, null]];
            rounds[2][0][finalSlot] = teamName;
        }

        lastVictoryData = { teamName: teamName, isTournamentWinner: false, timestamp: Date.now() };
        await saveTournamentStateDB();
        renderAll();
        triggerVictoryModal(teamName, false);
    }

    async function advanceFinalWinner(teamName) {
        if(!teamName || teamName === "NULL") return;
        let finalMatch = rounds[2][0];
        let opponent = (finalMatch[0] === teamName) ? finalMatch[1] : finalMatch[0];

        rounds[2][0] = [`👑 CAMPEÓN: ${teamName}`, opponent];

        lastVictoryData = { teamName: teamName, isTournamentWinner: true, timestamp: Date.now() };
        await saveTournamentStateDB();
        renderAll();
        triggerVictoryModal(teamName, true);
    }

    async function updateScore(sideKey, rIndex, matchIndex, teamNum, change) {
        let key = `${sideKey}_r${rIndex}_m${matchIndex}`;
        if(!matchScores[key]) matchScores[key] = { score1: 0, score2: 0 };

        if(teamNum === 1) {
            matchScores[key].score1 = Math.max(0, matchScores[key].score1 + change);
        } else {
            matchScores[key].score2 = Math.max(0, matchScores[key].score2 + change);
        }

        await saveTournamentStateDB();
        renderAll();
    }

    async function setStreamMatch(sideKey, rIndex, matchIndex, t1, t2) {
        if(!t1 || !t2 || t1 === "NULL" || t2 === "NULL") return alert("Combate no disponible todavía.");
        let key = `${sideKey}_r${rIndex}_m${matchIndex}`;
        let scores = matchScores[key] || { score1: 0, score2: 0 };

        activeMatchData = { sideKey, rIndex, matchIndex, team1: t1, team2: t2, score1: scores.score1, score2: scores.score2 };
        await saveTournamentStateDB();
        alert(`¡Combate enviado al stream: ${t1} vs ${t2}!`);
        renderAll();
    }

    function getTeamAbbr(teamName) {
        if (!teamName || teamName === "NULL") return "NULL";
        if (teamName.includes("👑 CAMPEÓN:")) return teamName.replace("👑 CAMPEÓN: ", "");
        let found = teams.find(t => t.name === teamName);
        if(found && found.abbr) return found.abbr;
        if(teamName.length > 5) return teamName.substring(0, 3).toUpperCase();
        return teamName;
    }

    function toggleTeamDisplay(elementId, fullName) {
        let el = document.getElementById(elementId);
        if(!el || fullName === "NULL") return;
        let cleanName = fullName.includes("👑 CAMPEÓN:") ? fullName.replace("👑 CAMPEÓN: ", "") : fullName;
        if(el.dataset.showing === "full") {
            el.innerText = el.dataset.abbr;
            el.dataset.showing = "abbr";
        } else {
            el.innerText = cleanName;
            el.dataset.showing = "full";
        }
    }

    function renderAll() {
        document.getElementById("playerCounter").innerText = players.length;
        let rList = document.getElementById("rosterList");
        rList.innerHTML = players.map((p, i) => `
            <div class="team-player">
                <div>
                    <span>${p.name}</span>
                    <div style="font-size:11px; color:#aaa;">ID: ${p.discord_id || 'N/A'}</div>
                </div>
                <span class="rank-tag">${p.rank}</span>
                <button style="background:#ff4444; border:none; color:white; border-radius:4px; padding:2px 5px; cursor:pointer;" onclick="removePlayerFromRoster(${i})">X</button>
            </div>`).join('');

        let tCont = document.getElementById("teamsContainer");
        tCont.innerHTML = teams.length === 0 ? `<div style="color: #666; text-align:center; padding: 20px;">Sin equipos</div>` :
        teams.map((t, ti) => `
            <div class="team-card">
                <div class="team-title" onclick="editTeamInfo(${ti})">
                    ${t.name} <span style="background:rgba(195,140,255,0.2); color:#c38cff; padding:2px 6px; border-radius:4px; font-size:12px; margin-left:5px;">[${t.abbr || '---'}]</span> ✏️
                </div>
                ${t.players.map((p, pi) => {
                    if(p.isPlaceholder) {
                        return `<div class="team-player" style="background:rgba(255,165,0,0.1); border:1px dashed orange; cursor:pointer;" onclick="replacePlaceholderPlayer(${ti}, ${pi})"><span>${p.name}</span> <span style="color:orange; font-size:11px;">(Añadir)</span></div>`;
                    }
                    return `
                        <div class="team-player">
                            <div>
                                <span>${p.name}</span>
                                <div style="font-size:11px; color:#aaa;">ID: ${p.discord_id || 'N/A'}</div>
                            </div>
                            <span class="rank-tag">${p.rank}</span>
                            <button style="background:#ff4444; border:none; color:white; border-radius:4px; padding:2px 4px; cursor:pointer;" onclick="removePlayerFromTeam(${ti}, ${pi})">Quitar</button>
                        </div>`;
                }).join('')}
            </div>
        `).join('');

        let bCont = document.getElementById("bracketContainer");
        if(rounds.length === 0) {
            bCont.innerHTML = `<div style="color: #666; text-align:center; width:100%;">Sin bracket</div>`;
            return;
        }

        let leftSideHTML = renderSide(rounds[0], 0, "left");
        let finalHTML = renderFinal();
        let rightSideHTML = renderSide(rounds[1], 1, "right");

        bCont.innerHTML = `
            <div style="display: flex; gap: 15px; align-items: center;">${leftSideHTML}</div>
            <div style="display: flex; flex-direction: column; align-items: center; padding: 0 10px;">${finalHTML}</div>
            <div style="display: flex; gap: 15px; align-items: center; flex-direction: row-reverse;">${rightSideHTML}</div>
        `;
    }

    function renderSide(sideRounds, sideIndex, sideKey) {
        return sideRounds.map((rt, ri) => `
            <div class="round" style="display: flex; flex-direction: column; gap: 15px; justify-content: center; min-width: 220px;">
                <div style="font-size: 12px; color: #a65cff; font-weight: bold; text-align: center; margin-bottom: 5px;">${sideKey.toUpperCase()} - F${ri + 1}</div>
                ${forMatch(rt, ri, sideIndex, sideKey)}
            </div>
        `).join('');
    }

    function forMatch(rt, ri, sideIndex, sideKey) {
        let html = "";
        let matchCounter = 0;
        for(let i=0; i<rt.length; i+=2) {
            let t1 = rt[i];
            let t2 = rt[i+1];

            let mIndex = matchCounter++;
            let key = `${sideKey}_r${ri}_m${mIndex}`;
            let scores = matchScores[key] || { score1: 0, score2: 0 };

            let s1Class = scores.score1 > scores.score2 ? "winner-score" : "";
            let s2Class = scores.score2 > scores.score1 ? "winner-score" : "";

            let abbr1 = getTeamAbbr(t1);
            let abbr2 = getTeamAbbr(t2);
            let idEl1 = `${sideKey}_m_${ri}_${mIndex}_t1`;
            let idEl2 = `${sideKey}_m_${ri}_${mIndex}_t2`;

            let display1 = (t1 === null || t1 === undefined) ? "NULL" : abbr1;
            let display2 = (t2 === null || t2 === undefined) ? "NULL" : abbr2;
            let fullText1 = (t1 === null || t1 === undefined) ? "NULL" : t1;
            let fullText2 = (t2 === null || t2 === undefined) ? "NULL" : t2;

            html += `
                <div class="match" style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px;">
                    <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 6px;">
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <span style="font-weight: bold; color: #2ecc71; font-size: 13px;">[${scores.score1}]</span>
                            <span id="${idEl1}" class="match-team ${s1Class}" style="font-weight: bold; font-size: 13px; ${t1 === null ? 'color: #777; font-style: italic;' : ''}" data-abbr="${abbr1}" data-showing="abbr" onclick="toggleTeamDisplay('${idEl1}', '${fullText1}')">
                                ${display1}
                                ${t1 !== null && t1 !== "NULL" ? `<span class="tooltip-name">${t1}</span>` : ''}
                            </span>
                        </div>
                        <div style="display: flex; gap: 2px;">
                            <button style="background:rgba(255,255,255,0.1); border:none; color:white; width:18px; height:18px; border-radius:3px; cursor:pointer; font-size:10px;" onclick="updateScore('${sideKey}', ${ri}, ${mIndex}, 1, -1)">-</button>
                            <button style="background:rgba(255,255,255,0.1); border:none; color:white; width:18px; height:18px; border-radius:3px; cursor:pointer; font-size:10px;" onclick="updateScore('${sideKey}', ${ri}, ${mIndex}, 1, 1)">+</button>
                            ${t1 !== null && t1 !== "NULL" ? `<button style="background:#6c5ce7; border:none; color:white; padding:0 4px; border-radius:3px; cursor:pointer; font-size:10px;" onclick="advanceMatch(${sideIndex}, ${ri}, ${i}, '${t1}')">✔</button>` : ''}
                        </div>
                    </div>

                    <div style="text-align: center; font-size: 10px; color: #777; font-weight: bold;">---- VS ----</div>

                    <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 6px;">
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <span style="font-weight: bold; color: #2ecc71; font-size: 13px;">[${scores.score2}]</span>
                            <span id="${idEl2}" class="match-team ${s2Class}" style="font-weight: bold; font-size: 13px; ${t2 === null ? 'color: #777; font-style: italic;' : ''}" data-abbr="${abbr2}" data-showing="abbr" onclick="toggleTeamDisplay('${idEl2}', '${fullText2}')">
                                ${display2}
                                ${t2 !== null && t2 !== "NULL" ? `<span class="tooltip-name">${t2}</span>` : ''}
                            </span>
                        </div>
                        <div style="display: flex; gap: 2px;">
                            <button style="background:rgba(255,255,255,0.1); border:none; color:white; width:18px; height:18px; border-radius:3px; cursor:pointer; font-size:10px;" onclick="updateScore('${sideKey}', ${ri}, ${mIndex}, 2, -1)">-</button>
                            <button style="background:rgba(255,255,255,0.1); border:none; color:white; width:18px; height:18px; border-radius:3px; cursor:pointer; font-size:10px;" onclick="updateScore('${sideKey}', ${ri}, ${mIndex}, 2, 1)">+</button>
                            ${t2 !== null && t2 !== "NULL" ? `<button style="background:#6c5ce7; border:none; color:white; padding:0 4px; border-radius:3px; cursor:pointer; font-size:10px;" onclick="advanceMatch(${sideIndex}, ${ri}, ${i+1}, '${t2}')">✔</button>` : ''}
                        </div>
                    </div>

                    ${(t1 !== null && t2 !== null && t1 !== "NULL" && t2 !== "NULL") ? `<button class="btn-primary" style="font-size:10px; padding:3px; margin-top:2px; background: #0984e3; cursor:pointer;" onclick="setStreamMatch('${sideKey}', ${ri}, ${mIndex}, '${t1}', '${t2}')">📺 Enviar al Stream</button>` : ''}
                </div>
            `;
        }
        return html;
    }

    function renderFinal() {
        if(!rounds[2] || !rounds[2][0]) return `<div style="font-size:12px; color:#777;">Gran Final Pendiente</div>`;
        let finalMatch = rounds[2][0];
        let t1 = finalMatch[0];
        let t2 = finalMatch[1];

        let key = `final_r0_m0`;
        let scores = matchScores[key] || { score1: 0, score2: 0 };
        let s1Class = scores.score1 > scores.score2 ? "winner-score" : "";
        let s2Class = scores.score2 > scores.score1 ? "winner-score" : "";

        let abbr1 = getTeamAbbr(t1);
        let abbr2 = getTeamAbbr(t2);
        let idEl1 = `final_t1`;
        let idEl2 = `final_t2`;

        let display1 = (t1 === null || t1 === undefined) ? "NULL" : abbr1;
        let display2 = (t2 === null || t2 === undefined) ? "NULL" : abbr2;
        let fullText1 = (t1 === null || t1 === undefined) ? "NULL" : t1;
        let fullText2 = (t2 === null || t2 === undefined) ? "NULL" : t2;

        return `
            <div style="font-size: 12px; color: gold; font-weight: bold; margin-bottom: 8px; text-align: center;">🏆 GRAN FINAL</div>
            <div class="match" style="background: rgba(255,215,0,0.05); border: 1px solid rgba(255,215,0,0.3); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; width: 240px;">
                <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 6px 8px; border-radius: 6px;">
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="font-weight: bold; color: #2ecc71; font-size: 13px;">[${scores.score1}]</span>
                        <span id="${idEl1}" class="match-team ${s1Class}" style="font-weight: bold; font-size: 13px; ${t1 === null ? 'color: #777; font-style: italic;' : ''}" data-abbr="${abbr1}" data-showing="abbr" onclick="toggleTeamDisplay('${idEl1}', '${fullText1}')">
                            ${display1}
                            ${t1 !== null && t1 !== "NULL" ? `<span class="tooltip-name">${t1}</span>` : ''}
                        </span>
                    </div>
                    <div style="display: flex; gap: 2px;">
                        <button style="background:rgba(255,255,255,0.1); border:none; color:white; width:18px; height:18px; border-radius:3px; cursor:pointer; font-size:10px;" onclick="updateScore('final', 0, 0, 1, -1)">-</button>
                        <button style="background:rgba(255,255,255,0.1); border:none; color:white; width:18px; height:18px; border-radius:3px; cursor:pointer; font-size:10px;" onclick="updateScore('final', 0, 0, 1, 1)">+</button>
                        ${t1 !== null && t1 !== "NULL" && !t1.includes("👑 CAMPEÓN") ? `<button style="background:gold; color:#000; border:none; padding:0 6px; border-radius:3px; cursor:pointer; font-weight:bold; font-size:10px;" onclick="advanceFinalWinner('${t1}')">👑</button>` : ''}
                    </div>
                </div>

                <div style="text-align: center; font-size: 10px; color: gold; font-weight: bold;">---- VS ----</div>

                <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 6px 8px; border-radius: 6px;">
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="font-weight: bold; color: #2ecc71; font-size: 13px;">[${scores.score2}]</span>
                        <span id="${idEl2}" class="match-team ${s2Class}" style="font-weight: bold; font-size: 13px; ${t2 === null ? 'color: #777; font-style: italic;' : ''}" data-abbr="${abbr2}" data-showing="abbr" onclick="toggleTeamDisplay('${idEl2}', '${fullText2}')">
                            ${display2}
                            ${t2 !== null && t2 !== "NULL" ? `<span class="tooltip-name">${t2}</span>` : ''}
                        </span>
                    </div>
                    <div style="display: flex; gap: 2px;">
                        <button style="background:rgba(255,255,255,0.1); border:none; color:white; width:18px; height:18px; border-radius:3px; cursor:pointer; font-size:10px;" onclick="updateScore('final', 0, 0, 2, -1)">-</button>
                        <button style="background:rgba(255,255,255,0.1); border:none; color:white; width:18px; height:18px; border-radius:3px; cursor:pointer; font-size:10px;" onclick="updateScore('final', 0, 0, 2, 1)">+</button>
                        ${t2 !== null && t2 !== "NULL" && !t2.includes("👑 CAMPEÓN") ? `<button style="background:gold; color:#000; border:none; padding:0 6px; border-radius:3px; cursor:pointer; font-weight:bold; font-size:10px;" onclick="advanceFinalWinner('${t2}')">👑</button>` : ''}
                    </div>
                </div>

                ${(t1 !== null && t2 !== null && t1 !== "NULL" && t2 !== "NULL") ? `<button class="btn-primary" style="font-size:10px; padding:3px; margin-top:2px; background: #0984e3; cursor:pointer;" onclick="setStreamMatch('final', 0, 0, '${t1}', '${t2}')">📺 Enviar al Stream</button>` : ''}
            </div>
        `;
    }

    loadDataFromDB();
</script>

</body>
</html>
