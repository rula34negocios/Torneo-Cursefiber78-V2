<!DOCTYPE html>
<html lang="es">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Widget - Marcador Estilo Deportes</title>
  <style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .stream-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 15px;
        filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
    }

    .broadcast-scoreboard {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .team-container-left, .team-container-right {
        position: relative;
        display: flex;
        flex-direction: column;
    }

    .team-container-left {
        align-items: flex-start;
    }

    .team-container-right {
        align-items: flex-end;
    }

    .broadcast-team-left {
        background: linear-gradient(135deg, #2b3e50, #1a252f);
        border: 2px solid #34495e;
        border-right: none;
        border-top-left-radius: 8px;
        border-bottom-left-radius: 8px;
        padding: 10px 20px;
        min-width: 140px;
        max-width: 200px;
        text-align: right;
        position: relative;
        clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
        z-index: 2;
    }

    .broadcast-team-right {
        background: linear-gradient(135deg, #1a252f, #2b3e50);
        border: 2px solid #34495e;
        border-left: none;
        border-top-right-radius: 8px;
        border-bottom-right-radius: 8px;
        padding: 10px 20px;
        min-width: 140px;
        max-width: 200px;
        text-align: left;
        position: relative;
        clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%);
        z-index: 2;
    }

    .broadcast-team-name {
        font-size: 15px;
        font-weight: 900;
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    .broadcast-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
    }

    .broadcast-status-badge {
        background: linear-gradient(180deg, #bdc3c7, #7f8c8d);
        color: #111;
        font-size: 9px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        padding: 2px 14px;
        border-top-left-radius: 6px;
        border-top-right-radius: 6px;
        border: 1px solid #95a5a6;
        border-bottom: none;
        box-shadow: 0 -2px 5px rgba(0,0,0,0.3);
    }

    .broadcast-scores-box {
        background: linear-gradient(135deg, #1e3799, #0c2461);
        border: 2px solid #4a69bd;
        border-radius: 6px;
        padding: 6px 18px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 15px rgba(12, 36, 97, 0.7);
    }

    .broadcast-score-num {
        font-size: 24px;
        font-weight: 900;
        color: #ffffff;
        text-shadow: 0 0 10px rgba(255,255,255,0.6);
        min-width: 24px;
        text-align: center;
    }

    .winning-score {
        color: #f1c40f !important;
        text-shadow: 0 0 12px rgba(241, 196, 15, 0.8) !important;
    }

    .equal-score {
        color: #e74c3c !important;
        text-shadow: 0 0 12px rgba(231, 76, 60, 0.8) !important;
    }

    .broadcast-score-divider {
        font-size: 20px;
        font-weight: 900;
        color: #4a69bd;
    }

    .waiting-text {
        color: #aaa;
        background: rgba(18, 18, 30, 0.9);
        border: 1px solid rgba(150, 80, 255, 0.4);
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: bold;
        text-align: center;
    }

    /* Animaciones Épicas de Celebración con Destello / Slash y Rebote 3D */
    @keyframes epicSlashEntrance {
        0% {
            transform: scale(0.3) rotateX(45deg) translateY(50px);
            opacity: 0;
            filter: drop-shadow(0 0 0 rgba(255, 215, 0, 0));
        }
        50% {
            transform: scale(1.08) rotateX(-10deg) translateY(-15px);
            opacity: 1;
            filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.95));
        }
        100% {
            transform: scale(1) rotateX(0deg) translateY(0);
            opacity: 1;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.7));
        }
    }

    @keyframes goldEnergyPulse {
        0% {
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6), inset 0 0 20px rgba(255, 215, 0, 0.4);
            border-color: #ffe066;
        }
        50% {
            box-shadow: 0 0 45px rgba(255, 215, 0, 1), inset 0 0 30px rgba(255, 245, 150, 0.8);
            border-color: #ffffff;
        }
        100% {
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6), inset 0 0 20px rgba(255, 215, 0, 0.4);
            border-color: #ffe066;
        }
    }

    @keyframes shineGoldText {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
    }

    @keyframes slashFlashOverlay {
        0% {
            transform: translateX(-150%) skewX(-25deg);
            opacity: 0.8;
        }
        50% {
            opacity: 1;
        }
        100% {
            transform: translateX(150%) skewX(-25deg);
            opacity: 0;
        }
    }

    .victory-celebration-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        perspective: 1000px;
    }

    .victory-card {
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
        border: 3px solid #d4af37;
        border-radius: 16px;
        padding: 20px 45px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        animation: epicSlashEntrance 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, goldEnergyPulse 2.5s infinite ease-in-out;
        text-align: center;
        min-width: 300px;
    }

    /* Franja brillante de energía tipo Slash que cruza al aparecer */
    .victory-card::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
        pointer-events: none;
        animation: slashFlashOverlay 0.9s ease-out forwards;
    }

    .victory-badge-top {
        background: linear-gradient(90deg, #b8860b, #ffd700, #fff, #ffd700, #b8860b);
        background-size: 200% auto;
        color: #111;
        font-size: 11px;
        font-weight: 950;
        text-transform: uppercase;
        letter-spacing: 3px;
        padding: 4px 18px;
        border-radius: 20px;
        box-shadow: 0 2px 10px rgba(255, 215, 0, 0.6);
        animation: shineGoldText 2.5s linear infinite;
    }

    .victory-team-name {
        font-size: 30px;
        font-weight: 950;
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 20px rgba(255, 215, 0, 0.8);
        margin: 6px 0;
    }

    .victory-subtext {
        font-size: 12px;
        font-weight: 900;
        color: #f1c40f;
        text-transform: uppercase;
        letter-spacing: 3.5px;
        text-shadow: 0 0 8px rgba(241, 196, 15, 0.7);
    }

    .champion-stream-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgba(20, 20, 30, 0.95);
        border: 2px solid gold;
        border-radius: 12px;
        padding: 20px 40px;
        box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
        text-align: center;
        animation: epicSlashEntrance 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .champion-title-text {
        font-size: 14px;
        color: gold;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-top: 8px;
        text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
    }

    .champion-name-text {
        font-size: 28px;
        color: #ffffff;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>

<div id="streamContainer" style="display: flex; justify-content: center; align-items: center; height: 100%;">
  <div class="waiting-text">Esperando que el admin inicie un combate...</div>
</div>

<script>
  const SUPABASE_URL = 'https://twxnbbgusthujzdikjeo.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_czF-mMgKB69Ox0JtMb24KA_VSw-LGKm';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentMatchData = null;
  let globalMatchScores = {};
  let lastVictoryData = null;
  let championBox = null;
  let tempVictoryTimer = null;

  async function loadTournamentState() {
      let { data } = await _supabase.from('tournament_state').select('active_match, match_scores, last_victory, champion_box').eq('id', 1).single();
      if (data) {
          globalMatchScores = data.match_scores || {};
          lastVictoryData = data.last_victory || null;
          championBox = data.champion_box || null;
          processDisplayState(data.active_match);
      }
  }

  function processDisplayState(activeMatch) {
      if (championBox) {
          renderChampionView(championBox);
          return;
      }

      if (lastVictoryData && lastVictoryData.timestamp) {
          let elapsed = Date.now() - lastVictoryData.timestamp;
          if (elapsed < 15000) {
              renderVictoryStreamView(lastVictoryData.teamName);
              if (!tempVictoryTimer) {
                  let remaining = 15000 - elapsed;
                  tempVictoryTimer = setTimeout(() => {
                      tempVictoryTimer = null;
                      loadTournamentState();
                  }, remaining);
              }
              return;
          }
      }

      if (activeMatch && activeMatch.team1 && activeMatch.team2) {
          currentMatchData = activeMatch;
          renderStreamMatch(currentMatchData);
      } else {
          currentMatchData = null;
          renderWaitingView();
      }
  }

  function renderWaitingView() {
      let container = document.getElementById("streamContainer");
      container.innerHTML = `<div class="waiting-text">ESPERANDO PROXIMO COMBATE</div>`;
  }

  function renderChampionView(champName) {
      let container = document.getElementById("streamContainer");
      container.innerHTML = `
          <div class="champion-stream-container">
              <div class="champion-name-text">${champName}</div>
              <div class="champion-title-text">CAMPEON DEL TORNEO</div>
          </div>
      `;
  }

  function renderVictoryStreamView(teamName) {
      let container = document.getElementById("streamContainer");
      container.innerHTML = `
          <div class="victory-celebration-wrapper">
              <div class="victory-card">
                  <div class="victory-badge-top">¡VICTORIA!</div>
                  <div class="victory-team-name">${teamName}</div>
                  <div class="victory-subtext">AVANZA DE RONDA</div>
              </div>
          </div>
      `;
  }

  function renderStreamMatch(match) {
      let container = document.getElementById("streamContainer");

      let scoreKey = `${match.sideKey}_r${match.rIndex}_m${match.matchIndex}`;
      let liveScores = globalMatchScores[scoreKey];

      let s1 = liveScores ? liveScores.score1 : (match.score1 !== undefined ? match.score1 : 0);
      let s2 = liveScores ? liveScores.score2 : (match.score2 !== undefined ? match.score2 : 0);

      let t1 = match.team1;
      let t2 = match.team2;

      let score1Class = "";
      let score2Class = "";

      if (s1 > s2) {
          score1Class = "winning-score";
      } else if (s2 > s1) {
          score2Class = "winning-score";
      } else {
          score1Class = "equal-score";
          score2Class = "equal-score";
      }

      container.innerHTML = `
          <div class="stream-wrapper">
              <div class="broadcast-scoreboard">
                  <!-- Equipo 1 (Izquierda) -->
                  <div class="team-container-left">
                      <div class="broadcast-team-left">
                          <div class="broadcast-team-name">${t1}</div>
                      </div>
                  </div>

                  <!-- Centro: Estado y Marcador -->
                  <div class="broadcast-center">
                      <div class="broadcast-status-badge">EN VIVO</div>
                      <div class="broadcast-scores-box">
                          <span class="broadcast-score-num ${score1Class}">${s1}</span>
                          <span class="broadcast-score-divider">-</span>
                          <span class="broadcast-score-num ${score2Class}">${s2}</span>
                      </div>
                  </div>

                  <!-- Equipo 2 (Derecha) -->
                  <div class="team-container-right">
                      <div class="broadcast-team-right">
                          <div class="broadcast-team-name">${t2}</div>
                      </div>
                  </div>
              </div>
          </div>
      `;
  }

  loadTournamentState();

  // Escuchar cambios en tiempo real en la tabla tournament_state
  _supabase
    .channel('public:stream_widget_state')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'tournament_state' }, payload => {
        if (payload.new) {
            if (payload.new.match_scores) {
                globalMatchScores = payload.new.match_scores;
            }
            lastVictoryData = payload.new.last_victory || null;
            championBox = payload.new.champion_box || null;

            if (tempVictoryTimer) {
                clearTimeout(tempVictoryTimer);
                tempVictoryTimer = null;
            }

            processDisplayState(payload.new.active_match);
        }
    })
    .subscribe();
</script>

</body>
</html>
