<!DOCTYPE html>
<html lang="es">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Bracket - OBS</title>
    <style>
        :root {
            --primary: #7a3cff;
            --primary-glow: rgba(122, 60, 255, 0.4);
            --text-main: #ffffff;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            overflow: hidden;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
            background: transparent !important;
        }

        /* --- CONTENEDOR SIN FONDO NI BORDES --- */
        .bracket-fullscreen-grid {
            display: flex;
            flex: 1;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 20px;
            gap: 35px;
            align-items: center;
            justify-content: center;
            backdrop-filter: none !important;
            width: 100%;
            max-width: 1700px;
            box-sizing: border-box;
        }

        .round {
            display: flex;
            flex-direction: column;
            gap: 28px;
            justify-content: center;
            min-width: 250px;
            position: relative;
        }

        /* --- TARJETA DE COMBATE EN 2 CASILLAS VERTICALES --- */
        .match-card {
            background: rgba(22, 22, 35, 0.95);
            border: 1px solid rgba(166, 92, 255, 0.3);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: visible !important;
        }

        /* Casilla individual del equipo */
        .team-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(12, 12, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px 12px;
            position: relative;
        }

        .team-name {
            font-weight: 700;
            font-size: 14px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }

        .team-name.pending {
            color: #777799;
            font-style: italic;
            font-weight: 500;
            font-size: 13px;
        }

        .team-score {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(166, 92, 255, 0.3);
            border-radius: 6px;
            padding: 3px 10px;
            font-weight: 800;
            font-size: 14px;
            color: #ffffff;
            min-width: 24px;
            text-align: center;
        }

        /* Divisor VS central */
        .vs-divider {
            text-align: center;
            font-size: 10px;
            font-weight: 900;
            color: #8888aa;
            letter-spacing: 2px;
            margin: -2px 0;
            text-transform: uppercase;
        }

        /* --- CAMINO DORADO (GOLDEN PATH) PARA GANADORES --- */
        .team-box.gold-winner {
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.18), rgba(40, 30, 10, 0.85));
            border: 1px solid #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.35);
        }

        .team-box.gold-winner .team-name {
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        }

        .team-box.gold-winner .team-score {
            background: #ffd700;
            color: #000000;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        /* Líneas conectoras del Bracket */
        .connector-line {
            position: absolute;
            top: 50%;
            width: 20px;
            height: 2px;
            background: rgba(166, 92, 255, 0.3);
            z-index: 1;
        }
        .connector-line.left-side { right: -20px; }
        .connector-line.right-side { left: -20px; }

        .connector-line.gold-path {
            background: #ffd700;
            box-shadow: 0 0 8px #ffd700;
            height: 3px;
        }

        /* Insignia para pase automático (BYE) */
        .bye-badge {
            font-size: 11px;
            color: #00cec9;
            background: rgba(0, 206, 201, 0.1);
            border: 1px dashed #00cec9;
            border-radius: 6px;
            padding: 6px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* --- CASILLA ÚNICA DE GRAN FINAL --- */
        .grand-final-box {
            background: linear-gradient(135deg, rgba(40, 32, 10, 0.95), rgba(25, 20, 35, 0.95));
            border: 2px solid #ffd700;
            border-radius: 16px;
            padding: 16px;
            width: 280px;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.35);
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
        }

        .grand-final-title {
            color: #ffd700;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }

        /* Tooltip de nombre completo */
        .team-container {
            position: relative;
            display: inline-block;
            width: 100%;
            overflow: visible !important;
        }

        .team-container .tooltip-name {
            visibility: hidden;
            background-color: #161622;
            color: #ffd700;
            text-align: center;
            border-radius: 6px;
            padding: 5px 10px;
            position: absolute;
            z-index: 99999 !important;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            border: 1px solid rgba(255, 215, 0, 0.5);
            font-size: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        .team-container:hover .tooltip-name {
            visibility: visible;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="bracket-fullscreen-grid" id="bracketView">
        <div style="color:#888; text-align:center; width: 100%; font-size:16px;">Cargando mapa de trayectoria...</div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://twxnbbgusthujzdikjeo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_czF-mMgKB69Ox0JtMb24KA_VSw-LGKm';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let teams = [];
    let rounds = [];
    let matchScores = {};

    async function loadPublicData() {
        let { data, error } = await _supabase.from('tournament_state').select('teams, rounds, match_scores').eq('id', 1).single();
        if (data) {
            teams = data.teams || [];
            rounds = data.rounds || [];
            matchScores = data.match_scores || {};
            renderPublic();
        } else if (error) {
            console.error("Error al cargar datos en Supabase:", error);
        }
    }

    function getTeamAbbr(teamName) {
        if (!teamName || teamName === "NULL" || teamName.includes("Esperando")) return "";
        let cleanName = teamName.replace(/👑\s*CAMPEÓN[:\s]*/gi, "").trim();
        let found = teams.find(t => t.name === cleanName || t.name === teamName);
        if(found && found.abbr) return found.abbr;
        if(cleanName.length > 5) return cleanName.substring(0, 3).toUpperCase();
        return cleanName;
    }

    function renderPublic() {
        let bView = document.getElementById("bracketView");
        if(!rounds || rounds.length === 0 || !rounds[0] || rounds[0].length === 0) {
            bView.innerHTML = `<div style="color:#888; text-align:center; width:100%; font-size:16px;">El torneo aún no ha comenzado</div>`;
            return;
        }

        let leftSideHTML = renderSide(rounds[0], 0, "left");
        let finalHTML = renderFinal();
        let rightSideHTML = rounds.length > 1 ? renderSide(rounds[1], 1, "right") : "";

        bView.innerHTML = `
            <div style="display: flex; gap: 30px; align-items: center;">${leftSideHTML}</div>
            <div style="display: flex; flex-direction: column; align-items: center; padding: 0 10px;">${finalHTML}</div>
            <div style="display: flex; gap: 30px; align-items: center; flex-direction: row-reverse;">${rightSideHTML}</div>
        `;
    }

    function renderSide(sideRounds, sideIndex, sideKey) {
        if (!sideRounds) return "";
        return sideRounds.map((rt, ri) => `
            <div class="round">
                ${forPublicMatch(rt, ri, sideKey, sideIndex)}
            </div>
        `).join('');
    }

    function forPublicMatch(rt, ri, sideKey, sideIndex) {
        let html = "";
        let matchCounter = 0;
        for(let i = 0; i < rt.length; i += 2) {
            let t1 = rt[i] || "";
            let t2 = rt[i+1] || "";
            let mIndex = matchCounter++;
            let key = `${sideKey}_r${ri}_m${mIndex}`;
            let scores = matchScores[key] || { score1: 0, score2: 0 };

            let displayT1 = (t1 && t1 !== "NULL") ? t1 : "Esperando combate";
            let displayT2 = (t2 && t2 !== "NULL") ? t2 : "Esperando combate";

            let abbr1 = (t1 && t1 !== "NULL") ? (getTeamAbbr(t1) || t1) : "Esperando combate";
            let abbr2 = (t2 && t2 !== "NULL") ? (getTeamAbbr(t2) || t2) : "Esperando combate";

            let isWinner1 = false;
            let isWinner2 = false;

            if (t1 && t1 !== "NULL") {
                let checkRounds = sideIndex === 0 ? rounds[0] : rounds[1];
                if (checkRounds) {
                    for (let r = ri + 1; r < checkRounds.length; r++) {
                        if (checkRounds[r] && checkRounds[r].includes(t1)) {
                            isWinner1 = true; break;
                        }
                    }
                }
                if (rounds[2] && rounds[2][0] && rounds[2][0].includes(t1)) isWinner1 = true;
            }

            if (t2 && t2 !== "NULL") {
                let checkRounds = sideIndex === 0 ? rounds[0] : rounds[1];
                if (checkRounds) {
                    for (let r = ri + 1; r < checkRounds.length; r++) {
                        if (checkRounds[r] && checkRounds[r].includes(t2)) {
                            isWinner2 = true; break;
                        }
                    }
                }
                if (rounds[2] && rounds[2][0] && rounds[2][0].includes(t2)) isWinner2 = true;
            }

            if (!isWinner1 && !isWinner2) {
                if (scores.score1 > scores.score2 && scores.score1 > 0) isWinner1 = true;
                if (scores.score2 > scores.score1 && scores.score2 > 0) isWinner2 = true;
            }

            let connectorClass = (isWinner1 || isWinner2) ? "gold-path" : "";
            let connectorSide = sideKey === "left" ? "left-side" : "right-side";

            if (t1 && t1 !== "NULL" && (!t2 || t2 === "NULL" || t2.includes("Descansa") || t2.includes("Por definir")) && ri === 0) {
                html += `
                    <div class="match-card" style="border-color: rgba(0, 206, 201, 0.4);">
                        <div class="team-box gold-winner">
                            <div class="team-container">
                                <span class="team-name">${abbr1}</span>
                                <span class="tooltip-name">${displayT1}</span>
                            </div>
                            <span class="team-score">✔</span>
                        </div>
                        <div class="bye-badge">⚡ PASE AUTOMÁTICO</div>
                        <div class="connector-line ${connectorSide} gold-path"></div>
                    </div>
                `;
                continue;
            }

            let isPending1 = (!t1 || t1 === "NULL");
            let isPending2 = (!t2 || t2 === "NULL");

            html += `
                <div class="match-card">
                    <div class="team-box ${isWinner1 ? 'gold-winner' : ''}">
                        <div class="team-container">
                            <span class="team-name ${isPending1 ? 'pending' : ''}">${abbr1}</span>
                            ${!isPending1 ? `<span class="tooltip-name">${displayT1}</span>` : ''}
                        </div>
                        <span class="team-score">${scores.score1}</span>
                    </div>

                    <div class="vs-divider">VS</div>

                    <div class="team-box ${isWinner2 ? 'gold-winner' : ''}">
                        <div class="team-container">
                            <span class="team-name ${isPending2 ? 'pending' : ''}">${abbr2}</span>
                            ${!isPending2 ? `<span class="tooltip-name">${displayT2}</span>` : ''}
                        </div>
                        <span class="team-score">${scores.score2}</span>
                    </div>

                    <div class="connector-line ${connectorSide} ${connectorClass}"></div>
                </div>
            `;
        }
        return html;
    }

    function renderFinal() {
        let finalMatch = rounds[2] && rounds[2][0] ? rounds[2][0] : ["NULL", "NULL"];
        let t1 = finalMatch[0] || "NULL";
        let t2 = finalMatch[1] || "NULL";

        let key = `final_r0_m0`;
        let scores = matchScores[key] || { score1: 0, score2: 0 };

        let displayT1 = (t1 && t1 !== "NULL") ? t1.replace(/👑\s*CAMPEÓN[:\s]*/gi, "").trim() : "Esperando combate";
        let displayT2 = (t2 && t2 !== "NULL") ? t2.replace(/👑\s*CAMPEÓN[:\s]*/gi, "").trim() : "Esperando combate";

        let abbr1 = (t1 && t1 !== "NULL") ? (getTeamAbbr(displayT1) || displayT1) : "Esperando combate";
        let abbr2 = (t2 && t2 !== "NULL") ? (getTeamAbbr(displayT2) || displayT2) : "Esperando combate";

        let isChampion1 = t1.includes("CAMPEÓN") || (scores.score1 > scores.score2 && scores.score1 > 0);
        let isChampion2 = t2.includes("CAMPEÓN") || (scores.score2 > scores.score1 && scores.score2 > 0);

        let isPending1 = (t1 === "NULL");
        let isPending2 = (t2 === "NULL");

        return `
            <div class="grand-final-box">
                <div class="grand-final-title">👑 GRAN FINAL DEL TORNEO 👑</div>

                <div class="team-box ${isChampion1 ? 'gold-winner' : ''}" style="background:rgba(0,0,0,0.5);">
                    <div class="team-container">
                        <span class="team-name ${isPending1 ? 'pending' : ''}" style="font-size:15px;">${abbr1}</span>
                        ${!isPending1 ? `<span class="tooltip-name">${displayT1}</span>` : ''}
                    </div>
                    <span class="team-score" style="font-size:15px;">${scores.score1}</span>
                </div>

                <div class="vs-divider" style="color: #ffd700; font-size:11px;">★ cursedfiber78 ★</div>

                <div class="team-box ${isChampion2 ? 'gold-winner' : ''}" style="background:rgba(0,0,0,0.5);">
                    <div class="team-container">
                        <span class="team-name ${isPending2 ? 'pending' : ''}" style="font-size:15px;">${abbr2}</span>
                        ${!isPending2 ? `<span class="tooltip-name">${displayT2}</span>` : ''}
                    </div>
                    <span class="team-score" style="font-size:15px;">${scores.score2}</span>
                </div>
            </div>
        `;
    }

    loadPublicData();

    _supabase
      .channel('public:stream_bracket_live')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'tournament_state' }, payload => {
          if (payload.new) {
              teams = payload.new.teams || [];
              rounds = payload.new.rounds || [];
              matchScores = payload.new.match_scores || {};
              renderPublic();
          }
      })
      .subscribe();
</script>

</body>
</html>
